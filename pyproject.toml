[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commit-defender"
version = "1.1.4"
description = "AI-powered git pre-commit code review — catches issues before they land"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Youngju Jaden Kim" },
]
keywords = [
    "git", "pre-commit", "code-review", "ai", "linter",
    "openai", "azure-openai", "vscode",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "pathspec>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/commit-defender/commit-defender"
Repository = "https://github.com/commit-defender/commit-defender"
Issues = "https://github.com/commit-defender/commit-defender/issues"

[project.scripts]
commit-defender = "commit_defender.app:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.8.0",
    "black>=24.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["commit_defender", "installer"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".venv",
    "dist",
    "tests",
    ".env",
    "vscode-extension-gemini",
    "vscode-extension-old",
    "llm-templates",
    "blueprint.md",
    "docker-compose.yml",
    "Dockerfile",
    "package-lock.json",
    "uv.lock",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
