<?xml version="1.0" encoding="UTF-8"?>
<!--
  C4 — SPLIT
  Shield diagonally split top-left/bottom-right.
  Top-left half: flat orange fill.
  Bottom-right half: flat purple fill.
  A bright pink diagonal slash separates them.
  Zero blur. Maximum contrast.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <clipPath id="shield-clip">
      <path d="M64 12 L108 29 L108 66 Q108 97 64 119 Q20 97 20 66 L20 29 Z"/>
    </clipPath>
  </defs>

  <rect width="128" height="128" rx="22" fill="#18181b"/>

  <!-- Shield: top-left half (orange) -->
  <path d="M64 12 L108 29 L108 66 Q108 97 64 119 Q20 97 20 66 L20 29 Z"
        fill="#fb923c" clip-path="url(#shield-clip)"/>
  <!-- Overlay bottom-right triangle in purple -->
  <polygon points="20,66 108,29 108,66 86,102 64,119"
           fill="#9333ea" clip-path="url(#shield-clip)"/>

  <!-- Diagonal slash line (hot pink, crisp, 4px) -->
  <line x1="20" y1="66" x2="108" y2="29"
        stroke="#ec4899" stroke-width="4"
        clip-path="url(#shield-clip)"/>
  <!-- Thin white highlight on slash -->
  <line x1="20" y1="64" x2="108" y2="27"
        stroke="#ffffff" stroke-width="1" opacity="0.4"
        clip-path="url(#shield-clip)"/>

  <!-- Outer border -->
  <path d="M64 12 L108 29 L108 66 Q108 97 64 119 Q20 97 20 66 L20 29 Z"
        fill="none" stroke="#fda4af" stroke-width="2"/>

  <!-- </> white -->
  <path d="M55 51 L41 65 L55 79 L58 79 L44 65 L58 51 Z" fill="#ffffff"/>
  <path d="M67 51 L63 51 L59 79 L63 79 Z"               fill="#ffffff"/>
  <path d="M73 51 L70 51 L86 65 L70 79 L73 79 L89 65 Z" fill="#ffffff"/>
</svg>
