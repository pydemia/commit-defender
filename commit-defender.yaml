version: 1

# Severity level that causes a commit to be blocked.
# Options: error | warning | info
blocking_severity: error

linters:
  python:
    enabled: true
    tool: ruff
    # Pass any ruff rule selectors here; leave empty for defaults
    args: ["--select", "E,W,F,I"]

  javascript:
    enabled: true
    tool: eslint

  typescript:
    enabled: true
    tool: eslint

  shell:
    enabled: true
    tool: shellcheck

  markdown:
    enabled: false
    tool: markdownlint

ai_review:
  enabled: true
  # Azure OpenAI deployment name — must match the deployment in your Azure resource.
  model: gpt-5.1
  max_tokens: 1024
  # If true, a blocking=true AI review will abort the commit.
  # By default AI review is advisory only.
  blocking: false
  # Add project-specific context to the AI reviewer's system prompt.
  system_prompt_suffix: ""

# Azure OpenAI credentials are supplied via environment variables (not stored here):
#   AZURE_OPENAI_API_KEY      — your Azure OpenAI key
#   AZURE_OPENAI_ENDPOINT     — https://<resource>.openai.azure.com/
#   AZURE_OPENAI_DEPLOYMENT   — deployment name (overrides ai_review.model above)
#   AZURE_OPENAI_API_VERSION  — optional, defaults to 2024-08-01-preview

# Patterns to exclude from analysis (gitignore syntax).
exclude:
  - "*.lock"
  - "dist/**"
  - "build/**"
  - "node_modules/**"
  - "*.min.js"
  - ".venv/**"
  - "venv/**"
